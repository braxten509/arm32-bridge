[target.aarch64-linux-android]
# Android has no libpthread; Unicorn asks for it, so an empty stand-in is on the path.
# Unicorn's code generator also needs __clear_cache from clang's builtins library.
rustflags = ["-C", "link-arg=/home/braxtenchenay/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/21/lib/linux/libclang_rt.builtins-aarch64-android.a", "-L", "/home/braxtenchenay/dev/arm32-bridge/android-link-stubs"]
linker = "/home/braxtenchenay/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"

# The x86_64 build runs in the PC's Android emulator (Unicorn only; the
# translator writes ARM64 code).
[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=/home/braxtenchenay/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/21/lib/linux/libclang_rt.builtins-x86_64-android.a", "-L", "/home/braxtenchenay/dev/arm32-bridge/android-link-stubs"]
linker = "/home/braxtenchenay/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android30-clang"

