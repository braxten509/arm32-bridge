CC_aarch64_linux_android = "/home/braxtenchenay/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
CXX_aarch64_linux_android = "/home/braxtenchenay/Android/Sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++"
