[package]
name = "gamebridge-ios"
version = "0.1.0"
edition = "2021"
description = "Game Bridge's iPhone layer: runs the 64-bit ARM code of iPhone games on ARM64 Linux and Android"
license = "GPL-2.0-or-later"

[lib]
name = "gamebridge_ios"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ios-run"
path = "src/main.rs"

[dependencies]
aes = "0.8"
blowfish = "0.9"
cast5 = "0.11"
cipher = "0.4"
des = "0.8"
libc = "0.2.190"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
regex = "1.13.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "aac", "alac", "isomp4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"
