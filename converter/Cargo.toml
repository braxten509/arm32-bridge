[package]
name = "apk-convert"
version = "0.1.0"
edition = "2021"
description = "Converts a 32-bit-only Android game APK to run on 64-bit-only phones through arm32-bridge"
license = "GPL-2.0-or-later"

[dependencies]
arm32-bridge = { path = ".." }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha1 = "0.10.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
